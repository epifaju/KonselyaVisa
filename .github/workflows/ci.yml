name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/konselyavisa-api/pom.xml

      # OpenApiContractIT is part of Failsafe: public /v3/api-docs vs required-operations.json
      - name: Maven verify
        working-directory: backend/konselyavisa-api
        env:
          MAVEN_OPTS: -Xmx1g
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/konselyavisa-api/pom.xml

      - name: CycloneDX SBOM
        working-directory: backend/konselyavisa-api
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package
          cp target/classes/META-INF/sbom/application.cdx.json target/bom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: konselyavisa-api-bom
          path: backend/konselyavisa-api/target/bom.json
          if-no-files-found: error

      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,backend/konselyavisa-api/target

      - name: Build API image
        run: docker build -t konselyavisa-api:ci ./backend/konselyavisa-api

      - name: Trivy image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: konselyavisa-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
